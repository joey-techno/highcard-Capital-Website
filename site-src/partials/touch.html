
  <!-- GET IN TOUCH — emerald band: reach us (left) + qualify form (right) -->
  <section class="sec-touch felt">
    <div class="container">
      <h2 class="touch__title sec-title" data-split>Let&rsquo;s get in touch<span class="dot">.</span></h2>
      <div class="touch">
        <div class="touch__info" data-reveal>
          <p class="touch__lede">We are available for our client 24/7. If you need business funding, we can be reached here:</p>
          <ul class="touch__reach">
            <li>
              <span class="icon--chip"><span class="icon" data-icon="phone"></span></span>
              <span class="touch__reach-t"><b>Phone</b><a class="num" href="tel:+18000000000">(800) 000-0000</a></span>
            </li>
            <li>
              <span class="icon--chip"><span class="icon" data-icon="mail"></span></span>
              <span class="touch__reach-t"><b>Email</b><a href="mailto:hello@highcardcapital.example">hello@highcardcapital.example</a></span>
            </li>
          </ul>
        </div>

        <div class="touch__card" data-reveal="scale">
          <h3>See how much you qualify for<span class="dot">.</span></h3>
          <form class="form touch__form" id="qualifyForm">
            <div class="field"><label for="qf-name">Name</label><input id="qf-name" name="name" type="text" autocomplete="name" required placeholder="Alex Rivera"></div>
            <div class="field"><label for="qf-phone">Phone</label><input id="qf-phone" name="phone" type="tel" autocomplete="tel" required placeholder="(555) 000-0000"></div>
            <div class="field full"><label for="qf-email">Email</label><input id="qf-email" name="email" type="email" autocomplete="email" required placeholder="you@yourbusiness.com"></div>
            <div class="field full"><label for="qf-rev">Annual revenue</label>
              <select id="qf-rev" name="revenue" required>
                <option value="" disabled selected>Select a range</option>
                <option value="under-250k">Under $250K</option>
                <option value="250k-499k">$250K &ndash; $499K</option>
                <option value="500k-999k">$500K &ndash; $999K</option>
                <option value="over-1m">Over $1M</option>
              </select>
            </div>
            <div class="full">
              <button class="btn touch__btn" type="submit" data-magnetic>See my options</button>
            </div>
            <p class="full small touch__note"><span class="icon" data-icon="secure"></span>Soft pull only. No cost, no obligation.</p>
          </form>
        </div>
      </div>
    </div>
  </section>
